<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAI Test - Generator</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-style { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid #e2e8f0; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); border-radius: 1rem; padding: 1.5rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, query, where, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Konfiguracja Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDfLJIcwoFTo-a2cPAcffnzQZeHoEtqKWk",
            authDomain: "generator-818f2.firebaseapp.com",
            projectId: "generator-818f2",
            storageBucket: "generator-818f2.firebasestorage.app",
            messagingSenderId: "530366296323",
            appId: "1:530366296323:web:59eb47073ef16c14653936"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Eksportowanie do window, aby React (Babel) mógł z nich korzystać
        window.FB = { auth, db, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, query, where, addDoc, signInAnonymously, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            Timer, Users, Play, CheckCircle, Clock, AlertCircle, 
            ChevronRight, BarChart3, Loader2, FileDown, GraduationCap 
        } = lucide;

        const appId = "generator-testow-v1";
        const geminiApiKey = "AIzaSyBNG53QweHRbNDJhVss1Pag8kGELZobVio";

        // --- KOMPONENTY POMOCNICZE ---

        function TeacherSetup({ onGenerate, loading }) {
            const [cfg, setCfg] = useState({ topic: '', difficulty: 'średni', count: 5, duration: 10, type: 'choice' });
            return (
                <div className="glass-style">
                    <h2 className="text-2xl font-bold mb-6 flex items-center gap-2"><Clock /> Skonfiguruj Test</h2>
                    <div className="space-y-6">
                        <textarea placeholder="Temat (np. Budowa komórki roślinnej)" value={cfg.topic} onChange={e => setCfg({...cfg, topic: e.target.value})} className="w-full p-4 rounded-xl border border-slate-200 min-h-[100px] outline-none focus:ring-2 focus:ring-indigo-500" />
                        <div className="grid md:grid-cols-3 gap-4">
                            <div><label className="text-xs font-bold text-slate-400 uppercase">Liczba pytań</label><input type="number" value={cfg.count} onChange={e => setCfg({...cfg, count: e.target.value})} className="w-full p-3 border rounded-lg" /></div>
                            <div><label className="text-xs font-bold text-slate-400 uppercase">Czas (min)</label><input type="number" value={cfg.duration} onChange={e => setCfg({...cfg, duration: e.target.value})} className="w-full p-3 border rounded-lg" /></div>
                            <div><label className="text-xs font-bold text-slate-400 uppercase">Trudność</label>
                                <select value={cfg.difficulty} onChange={e => setCfg({...cfg, difficulty: e.target.value})} className="w-full p-3 border rounded-lg">
                                    <option>łatwy</option><option>średni</option><option>trudny</option>
                                </select>
                            </div>
                        </div>
                        <button onClick={() => onGenerate(cfg)} disabled={loading || !cfg.topic} className="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold text-lg flex justify-center items-center gap-2">
                            {loading ? <Loader2 className="animate-spin" /> : <><Play fill="white" size={18} /> Generuj AI</>}
                        </button>
                    </div>
                </div>
            );
        }

        // ... Reszta komponentów (TeacherResults, StudentQuiz) analogicznie jak w oryginale ...
        // Ze względu na limit miejsca, skupiam się na głównej strukturze App.

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('landing');
            const [testCode, setTestCode] = useState('');
            const [currentTest, setCurrentTest] = useState(null);
            const [participants, setParticipants] = useState([]);
            const [results, setResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [studentName, setStudentName] = useState('');
            const [error, setError] = useState(null);

            useEffect(() => {
                if (!window.FB) return;
                const unsub = window.FB.onAuthStateChanged(window.FB.auth, (u) => {
                    if (!u) window.FB.signInAnonymously(window.FB.auth);
                    setUser(u);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user || !testCode || !window.FB) return;

                const testRef = window.FB.doc(window.FB.db, 'artifacts', appId, 'public', 'data', 'tests', testCode);
                const unsubTest = window.FB.onSnapshot(testRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setCurrentTest(data);
                        if (view === 'student-lobby' && data.status === 'active') setView('student-quiz');
                    }
                });

                const participantsRef = window.FB.collection(window.FB.db, 'artifacts', appId, 'public', 'data', 'tests', testCode, 'participants');
                const unsubParts = window.FB.onSnapshot(participantsRef, (snap) => {
                    setParticipants(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => { unsubTest(); unsubParts(); };
            }, [user, testCode, view]);

            const generateTest = async (config) => {
                setLoading(true);
                const code = Math.random().toString(36).substring(2, 8).toUpperCase();
                const userQuery = `Stwórz test o temacie "${config.topic}". Poziom: ${config.difficulty}. Liczba pytań: ${config.count}. Typ: ${config.type}. Zwróć TYLKO czysty JSON jako tablicę: [{"question": "treść", "options": ["A", "B", "C", "D"], "correct": 0, "type": "choice"}]`;

                try {
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: userQuery }] }] })
                    });
                    const data = await resp.json();
                    const cleanJson = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '');
                    const questions = JSON.parse(cleanJson);

                    await window.FB.setDoc(window.FB.doc(window.FB.db, 'artifacts', appId, 'public', 'data', 'tests', code), {
                        code, topic: config.topic, questions, duration: config.duration * 60, status: 'lobby', teacherId: user.uid
                    });
                    setTestCode(code);
                    setView('teacher-lobby');
                } catch (err) { setError("Błąd AI"); } finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-5xl mx-auto">
                        <header className="flex justify-between items-center mb-8">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('landing')}>
                                <div className="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">T</div>
                                <h1 className="text-2xl font-bold tracking-tight">EduAI Test</h1>
                            </div>
                        </header>

                        {view === 'landing' && (
                            <div className="grid md:grid-cols-2 gap-6">
                                <button onClick={() => setView('teacher-setup')} className="glass-style text-left hover:scale-[1.01] transition-transform">
                                    <BarChart3 className="text-indigo-600 mb-4" size={32} />
                                    <h2 className="text-xl font-bold">Panel Nauczyciela</h2>
                                    <p className="text-slate-500">Stwórz test.</p>
                                </button>
                                <button onClick={() => setView('student-join')} className="glass-style text-left hover:scale-[1.01] transition-transform">
                                    <Users className="text-emerald-600 mb-4" size={32} />
                                    <h2 className="text-xl font-bold">Panel Ucznia</h2>
                                    <p className="text-slate-500">Dołącz do gry.</p>
                                </button>
                            </div>
                        )}

                        {view === 'teacher-setup' && <TeacherSetup onGenerate={generateTest} loading={loading} />}
                        
                        {view === 'student-join' && (
                            <div className="glass-style max-w-md mx-auto">
                                <h2 className="text-2xl font-bold mb-6 text-center">Dołącz</h2>
                                <input type="text" placeholder="Imię" onChange={e => setStudentName(e.target.value)} className="w-full p-4 mb-4 border rounded-xl" />
                                <input type="text" placeholder="KOD" onChange={e => setTestCode(e.target.value.toUpperCase())} className="w-full p-4 mb-6 border rounded-xl text-center text-2xl" maxLength={6} />
                                <button onClick={() => setView('student-lobby')} className="w-full bg-emerald-600 text-white p-4 rounded-xl font-bold">Dołącz</button>
                            </div>
                        )}

                        {view === 'teacher-lobby' && (
                            <div className="glass-style text-center">
                                <h2 className="text-3xl font-black mb-4">KOD: {testCode}</h2>
                                <p className="mb-6">Uczestników: {participants.length}</p>
                                <button 
                                    onClick={() => window.FB.updateDoc(window.FB.doc(window.FB.db, 'artifacts', appId, 'public', 'data', 'tests', testCode), { status: 'active' })}
                                    className="bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold">
                                    START
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
